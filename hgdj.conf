# 红果短剧综合去广告 · Zika 2026
# 适用于 Quantumult X 远程重写
# 开屏、插播、全屏、信息流及广告回传

hostname = *.pangolin-sdk-toutiao.com, *.pglstatp-toutiao.com, *.pstatp.com, *.byteimg.com, i.snssdk.com, i-lq.snssdk.com, is.snssdk.com, mcs.snssdk.com, security-lq.snssdk.com, tnc3-alisc1.snssdk.com, tnc3-aliec2.snssdk.com, activity-ag.awemeughun.com, dig.bdurl.net, *.zijieapi.com, p6-ad-sign.byteimg.com, p9-ad-sign.byteimg.com

# ==========================================
# ① 开屏 / 广告获取
# ==========================================
^https:\/\/[^\/]+\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/get_ads\/.*$ url reject-dict
^https:\/\/[^\/]+\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/settings\/.*$ url reject-dict

# ==========================================
# ② 剧集间插播 / 全屏视频广告
# ==========================================
^https:\/\/[^\/]+\.pglstatp-toutiao\.com\/.+\/toutiao\.mp4(?:\?.*)?$ url reject
^https:\/\/[^\/]+\.(?:pglstatp-toutiao|pstatp)\.com\/(?:obj|img)\/(?:ad-app-package|ad)\/.*$ url reject
^https:\/\/[^\/]+\.pstatp\.com\/obj\/ad-pattern\/renderer(?:\/.*)?$ url reject
^https:\/\/[^\/]+\.(?:pglstatp-toutiao|pstatp)\.com\/obj\/(?:ad|img\/ad)\/.*$ url reject
^https:\/\/[^\/]+\.(?:pglstatp-toutiao|pstatp)\.com\/.*\/(?:ad|ads|advert|advertisement)\/.*\.mp4(?:\?.*)?$ url reject

# ==========================================
# ③ 信息流 / Banner / 广告 API
# ==========================================
^https:\/\/(?:i|i-lq)\.snssdk\.com\/api\/ad\/.*$ url reject-dict
^https:\/\/(?:i|i-lq)\.snssdk\.com\/.*\/(?:ad|ads|advert|advertisement)\/.*$ url reject-dict

# ==========================================
# ④ 字节广告相关域
# ==========================================
^https:\/\/mcs\.snssdk\.com\/.*$ url reject
^https:\/\/tnc3-alisc1\.snssdk\.com\/.*$ url reject
^https:\/\/tnc3-aliec2\.snssdk\.com\/.*$ url reject
^https:\/\/security-lq\.snssdk\.com\/.*$ url reject
^https:\/\/is\.snssdk\.com\/.*$ url reject

# ==========================================
# ⑤ Zijie 广告链路
# ==========================================
^https:\/\/[^\/]*zijieapi\.com\/.*$ url reject

# ==========================================
# ⑥ 广告签名 / 广告素材
# ==========================================
^https:\/\/p6-ad-sign\.byteimg\.com\/.*$ url reject
^https:\/\/p9-ad-sign\.byteimg\.com\/.*$ url reject

# ==========================================
# ⑦ 广告曝光 / 点击 / 转化
# ==========================================
^https:\/\/[^\/]+\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/stats\/.*$ url reject
^https:\/\/activity-ag\.awemeughun\.com\/.*$ url reject
^https:\/\/dig\.bdurl\.net\/.*$ url reject

# ==========================================
# ⑧ 广告追踪资源
# ==========================================
^https:\/\/[^\/]+\.pstatp\.com\/bytecom\/resource\/track_log\/src\/.*$ url reject
^https:\/\/[^\/]+\.pstatp\.com\/obj\/mosaic-legacy\/.*\?from=ad.*$ url reject
